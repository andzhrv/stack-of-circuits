name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  NODE_VERSION: '20.x'


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: npm install, type-check, lint, and test
      run: |
          npm install
          npm run type-check
          npm run lint:ci
          npm run test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Login 🗝️
      run: echo '${{ secrets.YC_SA_JSON_CREDENTIALS }}' | docker login --username json_key --password-stdin cr.yandex

    - name: Build the Docker image 🏗️
      run: docker build . --file Dockerfile --tag cr.yandex/crpscepi51mor3q0mqog/soc-frontend:app

    - name: Push the Docker image 🛫
      run: docker push cr.yandex/crpscepi51mor3q0mqog/soc-frontend:app
